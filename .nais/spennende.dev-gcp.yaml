spec:
  azure:
    application:
      tenant: trygdeetaten.no
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        name: spennende
        diskAutoresize: true
        diskSize: 10
        diskType: SSD
        tier: db-f1-micro
        databases:
          - name: spennende
        flags:
          - name: cloudsql.enable_pgaudit
            value: "off"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  kafka:
    pool: nav-dev
